<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Product Extractor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .input-group { margin: 20px 0; }
        input[type="text"] { width: 400px; padding: 10px; margin-right: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .results { margin-top: 20px; }
        .product-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .product-image { max-width: 100px; max-height: 100px; object-fit: cover; }
        .stats { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 20px 0; }
        .download-btn { background: #28a745; margin-left: 10px; }
        .download-btn:hover { background: #1e7e34; }
        .loading { color: #007bff; font-style: italic; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Myntra Product Extractor</h1>
        <p>This tool extracts product information directly from Myntra pages using browser automation.</p>
        
        <div class="input-group">
            <label for="urlInput">Myntra URL:</label><br>
            <input type="text" id="urlInput" placeholder="https://www.myntra.com/men-tshirts" value="https://www.myntra.com/men-tshirts">
            <button onclick="extractProducts()">Extract Products</button>
            <button onclick="downloadResults()" class="download-btn" id="downloadBtn" style="display: none;">Download JSON</button>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <h3>Extraction Statistics</h3>
            <div id="statsContent"></div>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        let extractedProducts = [];
        let extractionInProgress = false;

        async function extractProducts() {
            if (extractionInProgress) {
                alert('Extraction already in progress. Please wait.');
                return;
            }

            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                alert('Please enter a valid Myntra URL');
                return;
            }

            if (!url.includes('myntra.com')) {
                alert('Please enter a valid Myntra URL');
                return;
            }

            extractionInProgress = true;
            document.getElementById('results').innerHTML = '<div class="loading">Starting extraction...</div>';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';

            try {
                // Open the URL in a new tab
                const newTab = window.open(url, '_blank');
                if (!newTab) {
                    throw new Error('Popup blocked. Please allow popups for this site.');
                }

                // Wait for the page to load
                await new Promise(resolve => setTimeout(resolve, 5000));

                // Extract products using the opened tab
                const products = await extractFromTab(newTab);
                
                if (products && products.length > 0) {
                    extractedProducts = products;
                    displayResults(products);
                    displayStats(products);
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                } else {
                    document.getElementById('results').innerHTML = '<div class="error">No products found. Please check the URL and try again.</div>';
                }

            } catch (error) {
                document.getElementById('results').innerHTML = `<div class="error">Extraction failed: ${error.message}</div>`;
                console.error('Extraction error:', error);
            } finally {
                extractionInProgress = false;
            }
        }

        async function extractFromTab(tab) {
            try {
                // Try to access the tab's content
                const products = await tab.eval(`
                    (function() {
                        const products = [];
                        const productElements = document.querySelectorAll('li.product-base');
                        
                        console.log('Found product elements:', productElements.length);
                        
                        productElements.forEach((element, index) => {
                            try {
                                const product = {};
                                
                                // Extract brand
                                const brandEl = element.querySelector('h3.product-brand');
                                product.brand = brandEl ? brandEl.textContent.trim() : '';
                                
                                // Extract name
                                const nameEl = element.querySelector('h4.product-product');
                                product.name = nameEl ? nameEl.textContent.trim() : '';
                                
                                // Extract discounted price
                                const priceEl = element.querySelector('span.product-discountedPrice');
                                product.discountedPrice = priceEl ? priceEl.textContent.trim() : '';
                                
                                // Extract original price
                                const originalEl = element.querySelector('span.product-strike');
                                product.originalPrice = originalEl ? originalEl.textContent.trim() : '';
                                
                                // Extract discount percentage
                                const discountEl = element.querySelector('span.product-discountPercentage');
                                product.discountPercentage = discountEl ? discountEl.textContent.trim() : '';
                                
                                // Extract rating
                                const ratingEl = element.querySelector('div.product-ratingsContainer > span:first-child');
                                product.rating = ratingEl ? ratingEl.textContent.trim() : '';
                                
                                // Extract ratings count
                                const ratingsCountEl = element.querySelector('div.product-ratingsCount');
                                product.ratingsCount = ratingsCountEl ? ratingsCountEl.textContent.trim() : '';
                                
                                // Extract product URL
                                const linkEl = element.querySelector('a');
                                product.productUrl = linkEl ? linkEl.href : '';
                                
                                // Extract image
                                const imgEl = element.querySelector('img');
                                product.productImage = imgEl ? imgEl.src : '';
                                
                                // Generate product code
                                product.productCode = 'MYN_' + Date.now() + '_' + index;
                                
                                // Add timestamp
                                product.extractionTimestamp = new Date().toISOString();
                                
                                products.push(product);
                            } catch (err) {
                                console.error('Error extracting product:', err);
                            }
                        });
                        
                        return products;
                    })()
                `);

                return products;
            } catch (error) {
                console.error('Error accessing tab content:', error);
                
                // Fallback: provide manual extraction instructions
                return await manualExtractionInstructions(tab);
            }
        }

        async function manualExtractionInstructions(tab) {
            // Since we can't directly access the tab content due to CORS, provide manual instructions
            const instructions = `
                <div class="error">
                    <h3>Manual Extraction Required</h3>
                    <p>Due to browser security restrictions, automatic extraction isn't possible. Here's how to extract manually:</p>
                    <ol>
                        <li>The Myntra page should now be open in a new tab</li>
                        <li>Scroll down to load more products (if needed)</li>
                        <li>Open browser Developer Tools (F12)</li>
                        <li>Go to Console tab</li>
                        <li>Copy and paste this code:</li>
                    </ol>
                    <pre style="background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto;">
const products = [];
const productElements = document.querySelectorAll('li.product-base');

productElements.forEach((element, index) => {
    const product = {};
    
    // Extract brand
    const brandEl = element.querySelector('h3.product-brand');
    product.brand = brandEl ? brandEl.textContent.trim() : '';
    
    // Extract name
    const nameEl = element.querySelector('h4.product-product');
    product.name = nameEl ? nameEl.textContent.trim() : '';
    
    // Extract discounted price
    const priceEl = element.querySelector('span.product-discountedPrice');
    product.discountedPrice = priceEl ? priceEl.textContent.trim() : '';
    
    // Extract original price
    const originalEl = element.querySelector('span.product-strike');
    product.originalPrice = originalEl ? originalEl.textContent.trim() : '';
    
    // Extract discount percentage
    const discountEl = element.querySelector('span.product-discountPercentage');
    product.discountPercentage = discountEl ? discountEl.textContent.trim() : '';
    
    // Extract rating
    const ratingEl = element.querySelector('div.product-ratingsContainer > span:first-child');
    product.rating = ratingEl ? ratingEl.textContent.trim() : '';
    
    // Extract ratings count
    const ratingsCountEl = element.querySelector('div.product-ratingsCount');
    product.ratingsCount = ratingsCountEl ? ratingsCountEl.textContent.trim() : '';
    
    // Extract product URL
    const linkEl = element.querySelector('a');
    product.productUrl = linkEl ? linkEl.href : '';
    
    // Extract image
    const imgEl = element.querySelector('img');
    product.productImage = imgEl ? imgEl.src : '';
    
    // Generate product code
    product.productCode = 'MYN_' + Date.now() + '_' + index;
    
    // Add timestamp
    product.extractionTimestamp = new Date().toISOString();
    
    products.push(product);
});

console.log('Extracted products:', products);
console.log('Copy this array and paste it below:');
                    </pre>
                    <p>After running the code, copy the output array and paste it in the textarea below:</p>
                    <textarea id="manualInput" rows="10" cols="80" placeholder="Paste the extracted products array here..."></textarea>
                    <br><br>
                    <button onclick="processManualInput()">Process Manual Input</button>
                </div>
            `;
            
            document.getElementById('results').innerHTML = instructions;
            return [];
        }

        function processManualInput() {
            const input = document.getElementById('manualInput').value.trim();
            if (!input) {
                alert('Please paste the extracted products array first.');
                return;
            }

            try {
                // Try to parse the input as JSON
                let products;
                if (input.startsWith('[') && input.endsWith(']')) {
                    // It's already an array, try to evaluate it
                    products = eval('(' + input + ')');
                } else {
                    // Try to find array in the text
                    const match = input.match(/\[[\s\S]*\]/);
                    if (match) {
                        products = eval('(' + match[0] + ')');
                    } else {
                        throw new Error('No valid array found in input');
                    }
                }

                if (Array.isArray(products) && products.length > 0) {
                    extractedProducts = products;
                    displayResults(products);
                    displayStats(products);
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                } else {
                    throw new Error('Invalid products array');
                }
            } catch (error) {
                alert('Error processing input: ' + error.message + '\n\nPlease make sure you copied the complete array from the console.');
            }
        }

        function displayResults(products) {
            const resultsDiv = document.getElementById('results');
            let html = '<h3>Extracted Products (' + products.length + ')</h3>';
            
            products.forEach((product, index) => {
                html += `
                    <div class="product-card">
                        <h4>${index + 1}. ${product.brand} - ${product.name}</h4>
                        <div style="display: flex; gap: 20px;">
                            <img src="${product.productImage}" alt="Product" class="product-image" onerror="this.style.display='none'">
                            <div>
                                <p><strong>Brand:</strong> ${product.brand}</p>
                                <p><strong>Name:</strong> ${product.name}</p>
                                <p><strong>Price:</strong> ${product.discountedPrice}</p>
                                <p><strong>Original:</strong> ${product.originalPrice}</p>
                                <p><strong>Discount:</strong> ${product.discountPercentage}</p>
                                <p><strong>Rating:</strong> ${product.rating}</p>
                                <p><strong>Reviews:</strong> ${product.ratingsCount}</p>
                                <p><strong>Product Code:</strong> ${product.productCode}</p>
                                <p><strong>URL:</strong> <a href="${product.productUrl}" target="_blank">View Product</a></p>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }

        function displayStats(products) {
            const statsDiv = document.getElementById('statsContent');
            const brands = [...new Set(products.map(p => p.brand).filter(b => b))];
            const avgPrice = products.reduce((sum, p) => {
                const price = parseFloat(p.discountedPrice.replace(/[^\d.]/g, ''));
                return sum + (isNaN(price) ? 0 : price);
            }, 0) / products.length;

            statsDiv.innerHTML = `
                <p><strong>Total Products:</strong> ${products.length}</p>
                <p><strong>Unique Brands:</strong> ${brands.length}</p>
                <p><strong>Average Price:</strong> ₹${avgPrice.toFixed(2)}</p>
                <p><strong>Extraction Time:</strong> ${new Date().toLocaleString()}</p>
            `;
            
            document.getElementById('stats').style.display = 'block';
        }

        function downloadResults() {
            if (!extractedProducts || extractedProducts.length === 0) {
                alert('No products to download');
                return;
            }

            const dataStr = JSON.stringify(extractedProducts, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `myntra_products_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Auto-fill URL if it's in the current page
        if (window.location.href.includes('myntra.com')) {
            document.getElementById('urlInput').value = window.location.href;
        }
    </script>
</body>
</html>
