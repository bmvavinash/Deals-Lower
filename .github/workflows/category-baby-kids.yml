name: '👶 Category: Baby & Kids'
on:
  schedule:
    - cron: '35 */2 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to scrape (overrides default)'
        required: false
        default: 'baby-kids'

env:
  HEADFUL: 'true'
  CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
  CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
  CI: 'true'
  NODE_ENV: production

jobs:
  category-baby-kids:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: category-baby-kids
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: |
          which google-chrome-stable || which google-chrome || which chromium-browser || echo 'Chrome not found'
          google-chrome-stable --version || google-chrome --version || chromium-browser --version || echo 'Version check failed'
      - run: xvfb-run --auto-servernum node actions/category-runner.js
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CATEGORY: ${{ github.event.inputs.category || 'baby-kids' }}

