name: '❤️ Favorites Check'
on:
  schedule:
    - cron: '0 * * * *'    # Every hour
    # - cron: '*/30 * * * *' # Uncomment for every 30 minutes
  workflow_dispatch:        # Allow manual trigger

env:
  HEADFUL: 'true'
  CI: 'true'
  NODE_ENV: production

jobs:
  favorites-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: favorites-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: |
          which google-chrome-stable || which google-chrome || which chromium-browser || echo 'Chrome not found'
          google-chrome-stable --version || google-chrome --version || chromium-browser --version || echo 'Version check failed'
      - run: xvfb-run --auto-servernum node actions/favorites-runner.js
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          USERS_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.USERS_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_KEY: ${{ secrets.TELEGRAM_BOT_KEY }}
          DEALS_GLOBAL_BOT_KEY: ${{ secrets.DEALS_GLOBAL_BOT_KEY }}

