name: Verify and Update Deals (Price & Expiration)

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      max_deals:
        description: 'Maximum number of deals to check'
        required: false
        default: '100'
      skip_live:
        description: 'Skip HTTP live price check (timer/DB only)'
        type: boolean
        default: false

jobs:
  verify-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Deals Verification and Update
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TRIGGER_SOURCE: 'github-actions'
        run: |
          if [ "${{ github.event.inputs.skip_live }}" = "true" ]; then
            node scripts/verifyAndUpdateDeals.js --max=${{ github.event.inputs.max_deals || 100 }} --skip-live
          else
            node scripts/verifyAndUpdateDeals.js --max=${{ github.event.inputs.max_deals || 100 }}
          fi
