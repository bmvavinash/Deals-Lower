name: '🎯 Amazon Promotional Cards Fetch'

on:
  schedule:
    - cron: '5 * * * *'    # Every 1 hour at :05 past the hour
  workflow_dispatch:       # Allow manual trigger anytime

permissions:
  contents: write

env:
  HEADFUL: 'true'
  CI: 'true'
  NODE_ENV: production

jobs:
  amazon-promo-cards-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: amazon-promo-cards-fetch
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check Chrome version
        run: |
          which google-chrome-stable || which google-chrome || which chromium-browser || echo 'Chrome not found'
          google-chrome-stable --version || google-chrome --version || chromium-browser --version || echo 'Version check failed'

      - name: Run Amazon Promo Cards Runner
        run: xvfb-run --auto-servernum node actions/amazon-promo-cards-runner.js
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Commit and push updated promo cards (if changed)
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Amazon Promo Cards]"
          git add database/amazon_promo_cards.json frontend/public/banners/card_scraped_*.png frontend/public/banners/amazon_promo_handpicked.* frontend/public/banners/amazon_8pm_deals.* frontend/public/banners/amazon_8pm_frame0.* 2>/dev/null || true
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(promo-cards): auto-update Amazon promotional cards [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || git push || echo "Git push skipped or failed due to repository permissions, continuing workflow."
          else
            echo "No changes in promotional cards detected."
          fi
